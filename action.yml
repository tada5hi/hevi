name: 'hevi'
description: 'Version, package, push and release Helm charts'
author: 'tada5hi'

branding:
    icon: 'anchor'
    color: 'blue'

inputs:
    directory:
        description: 'Directory that is scanned recursively for Chart.{yml,yaml} files'
        default: 'charts'
    hevi-version:
        description: 'Version of the hevi npm package to run. Defaults to the version this action ships with.'
        default: ''

    versionize:
        description: 'Bump or set the version of every chart'
        default: 'false'
    version:
        description: 'Explicit semver version for versionize. Bumps the patch version when empty.'
        default: ''
    dry-run:
        description: 'Run versionize without writing to the file system'
        default: 'false'

    package:
        description: 'Package the charts into .hevi/packages'
        default: 'false'

    release:
        description: 'Release the packaged charts to GitHub'
        default: 'false'
    release-owner:
        description: 'GitHub owner. Inferred from the workflow context when empty.'
        default: ''
    release-repo:
        description: 'GitHub repository name. Inferred from the workflow context when empty.'
        default: ''
    release-branch:
        description: 'Branch the charts and index.yaml are published to'
        default: 'gh-pages'
    token:
        description: 'Token used by release'
        default: ${{ github.token }}

    push:
        description: 'Push the packaged charts to an OCI registry'
        default: 'false'
    push-host:
        description: 'Registry host, e.g. ghcr.io'
        default: ''
    push-username:
        description: 'Registry username'
        default: ''
    push-password:
        description: 'Registry password or token'
        default: ''

runs:
    using: 'composite'
    steps:
        -   name: Install hevi
            shell: bash
            env:
                INPUT_HEVI_VERSION: ${{ inputs.hevi-version }}
            run: |
                VERSION="$INPUT_HEVI_VERSION"
                if [ -z "$VERSION" ]; then
                    VERSION="$(node -p "require('$GITHUB_ACTION_PATH/package.json').version")"
                fi

                echo "Installing hevi@$VERSION"
                npm install --global --no-fund --no-audit "hevi@$VERSION"

        -   name: Versionize
            if: inputs.versionize == 'true'
            shell: bash
            env:
                INPUT_DIRECTORY: ${{ inputs.directory }}
                INPUT_VERSION: ${{ inputs.version }}
                INPUT_DRY_RUN: ${{ inputs.dry-run }}
            run: |
                ARGS=()
                if [ -n "$INPUT_VERSION" ]; then
                    ARGS+=(--version "$INPUT_VERSION")
                fi
                if [ "$INPUT_DRY_RUN" = "true" ]; then
                    ARGS+=(--dryRun)
                fi

                hevi versionize "$INPUT_DIRECTORY" "${ARGS[@]}"

        -   name: Package
            if: inputs.package == 'true'
            shell: bash
            env:
                INPUT_DIRECTORY: ${{ inputs.directory }}
            run: |
                hevi package "$INPUT_DIRECTORY"

        -   name: Release
            if: inputs.release == 'true'
            shell: bash
            env:
                INPUT_DIRECTORY: ${{ inputs.directory }}
                INPUT_OWNER: ${{ inputs.release-owner }}
                INPUT_REPO: ${{ inputs.release-repo }}
                INPUT_BRANCH: ${{ inputs.release-branch }}
                GITHUB_TOKEN: ${{ inputs.token }}
            run: |
                ARGS=()
                if [ -n "$INPUT_OWNER" ]; then
                    ARGS+=(--owner "$INPUT_OWNER")
                fi
                if [ -n "$INPUT_REPO" ]; then
                    ARGS+=(--repo "$INPUT_REPO")
                fi
                if [ -n "$INPUT_BRANCH" ]; then
                    ARGS+=(--branch "$INPUT_BRANCH")
                fi

                hevi release "$INPUT_DIRECTORY" "${ARGS[@]}"

        -   name: Push
            if: inputs.push == 'true'
            shell: bash
            env:
                INPUT_DIRECTORY: ${{ inputs.directory }}
                INPUT_HOST: ${{ inputs.push-host }}
                INPUT_USERNAME: ${{ inputs.push-username }}
                INPUT_PASSWORD: ${{ inputs.push-password }}
            run: |
                hevi push "$INPUT_DIRECTORY" \
                    --host "$INPUT_HOST" \
                    --username "$INPUT_USERNAME" \
                    --password "$INPUT_PASSWORD"
