name: 'hevi'
description: 'Version, package, push and release Helm charts.'
inputs:
    directory:
        description: 'Directory that is scanned recursively for Chart.{yml,yaml} files.'
        required: false
        default: 'charts'

    versionize:
        description: 'Bump or set the version of every chart.'
        required: false
        default: 'false'
    version:
        description: 'Explicit semver version to set. Bumps the patch version when empty.'
        required: false
    dry-run:
        description: 'Run versionize without writing the changes to the file system.'
        required: false
        default: 'false'

    package:
        description: 'Package the charts into .hevi/packages.'
        required: false
        default: 'false'

    release:
        description: 'Release the packaged charts to GitHub.'
        required: false
        default: 'false'
    release-owner:
        description: 'GitHub owner. Inferred from the workflow context when empty.'
        required: false
    release-repo:
        description: 'GitHub repository name. Inferred from the workflow context when empty.'
        required: false
    release-branch:
        description: 'Branch the charts and index.yaml are published to.'
        required: false
        default: 'gh-pages'
    release-generate-notes:
        description: 'Let GitHub generate the release name and body from merged pull requests. Only relevant when chart-releaser owns the release creation.'
        required: false
        default: 'false'
    token:
        description: 'Token used to interact with GitHub.'
        required: false
        default: ${{ github.token }}

    push:
        description: 'Push the packaged charts to an OCI registry.'
        required: false
        default: 'false'
    push-host:
        description: 'Registry host, e.g. ghcr.io.'
        required: false
    push-username:
        description: 'Registry username.'
        required: false
    push-password:
        description: 'Registry password or token.'
        required: false
    push-skip-existing:
        description: 'Skip charts whose version already exists in the registry.'
        required: false
        default: 'false'

    node-version:
        description: 'Node.js version to use. Set to empty string to skip setup and use the existing Node.js installation.'
        required: false
        default: '24'

branding:
    icon: 'anchor'
    color: 'blue'

runs:
    using: 'composite'
    steps:
        - name: Setup Node.js
          if: inputs.node-version != ''
          uses: actions/setup-node@v7
          with:
              node-version: ${{ inputs.node-version }}

        - name: Install hevi dependencies
          shell: bash
          run: npm ci --ignore-scripts
          working-directory: ${{ github.action_path }}

        - name: Build hevi
          shell: bash
          run: npm run build
          working-directory: ${{ github.action_path }}

        - name: Versionize charts
          if: inputs.versionize == 'true'
          shell: bash
          run: |
              args=""
              if [ -n "${{ inputs.version }}" ]; then args="$args --version ${{ inputs.version }}"; fi
              if [ "${{ inputs['dry-run'] }}" = "true" ]; then args="$args --dryRun"; fi

              node "${{ github.action_path }}/dist/cli.mjs" versionize "${{ inputs.directory }}" $args

        - name: Package charts
          if: inputs.package == 'true'
          shell: bash
          run: |
              node "${{ github.action_path }}/dist/cli.mjs" package "${{ inputs.directory }}"

        - name: Release charts
          if: inputs.release == 'true'
          shell: bash
          env:
              GITHUB_TOKEN: ${{ inputs.token }}
          run: |
              args=""
              if [ -n "${{ inputs['release-owner'] }}" ]; then args="$args --owner ${{ inputs['release-owner'] }}"; fi
              if [ -n "${{ inputs['release-repo'] }}" ]; then args="$args --repo ${{ inputs['release-repo'] }}"; fi
              if [ -n "${{ inputs['release-branch'] }}" ]; then args="$args --branch ${{ inputs['release-branch'] }}"; fi
              if [ "${{ inputs['release-generate-notes'] }}" = "true" ]; then args="$args --generateReleaseNotes"; fi

              node "${{ github.action_path }}/dist/cli.mjs" release "${{ inputs.directory }}" $args

        - name: Push charts
          if: inputs.push == 'true'
          shell: bash
          env:
              PUSH_HOST: ${{ inputs['push-host'] }}
              PUSH_USERNAME: ${{ inputs['push-username'] }}
              PUSH_PASSWORD: ${{ inputs['push-password'] }}
          run: |
              args=""
              if [ "${{ inputs['push-skip-existing'] }}" = "true" ]; then args="--skipExisting"; fi

              node "${{ github.action_path }}/dist/cli.mjs" push "${{ inputs.directory }}" \
                  --host "$PUSH_HOST" \
                  --username "$PUSH_USERNAME" \
                  --password "$PUSH_PASSWORD" $args
