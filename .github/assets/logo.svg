<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
    <title>hevi</title>
    <defs>
        <linearGradient id="tile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3EC6E0"/>
            <stop offset="1" stop-color="#0B63CE"/>
        </linearGradient>
    </defs>

    <rect width="64" height="64" rx="14" fill="url(#tile)"/>
    <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity=".22"/>

    <!-- helm wheel: handles -->
    <g stroke="#FFFFFF" stroke-width="4.4" stroke-linecap="round">
        <line x1="32" y1="17" x2="32" y2="10"/>
        <line x1="32" y1="17" x2="32" y2="10" transform="rotate(45 32 32)"/>
        <line x1="32" y1="17" x2="32" y2="10" transform="rotate(90 32 32)"/>
        <line x1="32" y1="17" x2="32" y2="10" transform="rotate(135 32 32)"/>
        <line x1="32" y1="17" x2="32" y2="10" transform="rotate(180 32 32)"/>
        <line x1="32" y1="17" x2="32" y2="10" transform="rotate(225 32 32)"/>
        <line x1="32" y1="17" x2="32" y2="10" transform="rotate(270 32 32)"/>
        <line x1="32" y1="17" x2="32" y2="10" transform="rotate(315 32 32)"/>
    </g>

    <!-- helm wheel: rim -->
    <circle cx="32" cy="32" r="15" fill="none" stroke="#FFFFFF" stroke-width="4.4"/>

    <!-- helm wheel: spokes -->
    <g stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round">
        <line x1="32" y1="26" x2="32" y2="17"/>
        <line x1="32" y1="26" x2="32" y2="17" transform="rotate(45 32 32)"/>
        <line x1="32" y1="26" x2="32" y2="17" transform="rotate(90 32 32)"/>
        <line x1="32" y1="26" x2="32" y2="17" transform="rotate(135 32 32)"/>
        <line x1="32" y1="26" x2="32" y2="17" transform="rotate(180 32 32)"/>
        <line x1="32" y1="26" x2="32" y2="17" transform="rotate(225 32 32)"/>
        <line x1="32" y1="26" x2="32" y2="17" transform="rotate(270 32 32)"/>
        <line x1="32" y1="26" x2="32" y2="17" transform="rotate(315 32 32)"/>
    </g>

    <!-- helm wheel: hub -->
    <circle cx="32" cy="32" r="6.8" fill="#FFFFFF"/>
    <circle cx="32" cy="32" r="2.6" fill="url(#tile)"/>
</svg>
