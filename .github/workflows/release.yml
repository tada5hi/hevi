name: Release

on:
    push:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    pull-requests: write
    id-token: write

env:
    PRIMARY_NODE_VERSION: 24

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Release Please
              id: release
              uses: googleapis/release-please-action@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Checkout
              if: steps.release.outputs.releases_created == 'true'
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Configure Git
              if: steps.release.outputs.releases_created == 'true'
              shell: bash
              run: |
                  git config user.name "$GITHUB_ACTOR"
                  git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

            # The composite action is consumed as tada5hi/hevi@v<major>, so the
            # major and minor tags have to be repointed at every release.
            - name: Tag major and minor versions
              if: steps.release.outputs.releases_created == 'true'
              shell: bash
              env:
                  MAJOR: ${{ steps.release.outputs.major }}
                  MINOR: ${{ steps.release.outputs.minor }}
              run: |
                  git tag -d "v$MAJOR" || true
                  git tag -d "v$MAJOR.$MINOR" || true
                  git push origin ":v$MAJOR" || true
                  git push origin ":v$MAJOR.$MINOR" || true
                  git tag -a "v$MAJOR" -m "Release v$MAJOR"
                  git tag -a "v$MAJOR.$MINOR" -m "Release v$MAJOR.$MINOR"
                  git push origin "v$MAJOR"
                  git push origin "v$MAJOR.$MINOR"

            - name: Install
              if: steps.release.outputs.releases_created == 'true'
              uses: ./.github/actions/install
              with:
                  node-version: ${{ env.PRIMARY_NODE_VERSION }}
                  registry-url: 'https://registry.npmjs.org'

            - name: Build
              if: steps.release.outputs.releases_created == 'true'
              uses: ./.github/actions/build

            - name: Publish
              if: steps.release.outputs.releases_created == 'true'
              uses: tada5hi/monoship@v2.1.0
